<!DOCTYPE html>

<html lang="id">

<head>
  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Admin - Kelola Akun</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: #f5f7f6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .logo {
      width: 55px;
      height: 55px;
      border-radius: 15px;
      background: #259148;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 23px;
    }

    .subtitle {
      color: #777;
      font-size: 13px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      margin-bottom: 17px;
    }

    input:focus {
      border-color: #259148;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #259148;
      color: white;
    }

    .btn-primary:hover {
      opacity: .9;
    }

    .btn-logout {
      margin-top: 10px;
      background: #f1f1f1;
      color: #555;
    }

    .hidden {
      display: none !important;
    }

    .message {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .error {
      background: #fff0f0;
      color: #c62828;
    }

    .success {
      background: #edf9f1;
      color: #20803c;
    }

    .info {
      background: #f4f7f5;
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 20px;
      font-size: 12px;
      color: #666;
    }

    .admin-email {
      font-weight: 600;
      color: #259148;
      margin-top: 3px;
      word-break: break-word;
    }


    /* =====================================================
       PASSWORD TOGGLE
       ===================================================== */

    .password-wrapper {
      position: relative;
      margin-bottom: 17px;
    }
    
    .password-wrapper input {
      padding-right: 45px;
      margin-bottom: 0;
    }
    
    .password-toggle {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      padding: 0;
      margin: 0;
      border: 0;
      background: transparent;
      color: #777;
      font-size: 18px;
      line-height: 36px;
      text-align: center;
      cursor: pointer;
    }
    
    .password-toggle:hover {
      opacity: 1;
      color: #259148;
    }
  </style>

</head>

<body>

<div class="container">

  <!-- =====================================================
       LOGIN ADMIN
       ===================================================== -->

  <div
    id="loginCard"
    class="card"
  >

<div class="logo">
  🔐
</div>

<h1>Admin</h1>

<div class="subtitle">
  Kelola akun pengguna
</div>

<div
  id="loginMessage"
  class="message error hidden"
></div>

<label>Email Admin</label>

<input
  id="adminEmail"
  type="email"
  autocomplete="username"
  placeholder="Email admin"
>

<label>Password Admin</label>

<div class="password-wrapper">

  <input
    id="adminPassword"
    type="password"
    autocomplete="current-password"
    placeholder="Password admin"
  >

  <button
    type="button"
    class="password-toggle"
    onclick="togglePassword('adminPassword', this)"
    aria-label="Tampilkan password"
  >
    👁
  </button>

</div>

<button
  id="loginButton"
  class="btn-primary"
  onclick="loginAdmin()"
>
  Masuk
</button>

  </div>

  <!-- =====================================================
       ADMIN PANEL
       ===================================================== -->

  <div
    id="adminCard"
    class="card hidden"
  >

<div class="logo">
  ⚙️
</div>

<h1>Kelola Akun</h1>

<div class="subtitle">
  Ubah email dan password pengguna
</div>

<div class="info">

  Login sebagai:

  <div
    id="loggedAdminEmail"
    class="admin-email"
  ></div>

</div>

<div
  id="updateMessage"
  class="message hidden"
></div>

<label>Email Lama</label>

<input
  id="oldEmail"
  type="email"
  placeholder="Email akun yang mau diubah"
>

<label>Email Baru</label>

<input
  id="newEmail"
  type="email"
  placeholder="Kosongkan jika tidak ingin mengubah email"
>

<label>Password Baru</label>

<div class="password-wrapper">

  <input
    id="newPassword"
    type="password"
    placeholder="Kosongkan jika tidak ingin mengubah password"
  >

  <button
    type="button"
    class="password-toggle"
    onclick="togglePassword('newPassword', this)"
    aria-label="Tampilkan password"
  >
    👁
  </button>

</div>

<button
  id="updateButton"
  class="btn-primary"
  onclick="updateUser()"
>
  Simpan Perubahan
</button>

<button
  class="btn-logout"
  onclick="logoutAdmin()"
>
  Keluar
</button>

  </div>

</div>

<script>

  // =========================================================
  // SUPABASE
  // =========================================================

  const SUPABASE_URL =
    'https://evvqxxsojeiisrsuygky.supabase.co';

  const SUPABASE_ANON_KEY =
    'sb_publishable_RIJfZBsXRoq56wUkA1j19g_W8GPcm7Z';


  // =========================================================
  // EMAIL ADMIN YANG DIIZINKAN
  //
  // GANTI INI DENGAN EMAIL YANG LU DAFTARKAN
  // SEBAGAI ADMIN DI EDGE FUNCTION.
  //
  // =========================================================

  const ADMIN_EMAIL =
    'rojulanfayadulmujahid@gmail.com';


  // =========================================================
  // SUPABASE CLIENT
  // =========================================================

  const {
    createClient
  } = window.supabase;

  const supabaseClient =
    createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // =========================================================
  // HELPER CEK ADMIN
  // =========================================================

  function isAdminUser(user) {

    if (!user || !user.email) {
      return false;
    }

    return (
      user.email.trim().toLowerCase() ===
      ADMIN_EMAIL.trim().toLowerCase()
    );
  }


  // =========================================================
  // TOGGLE PASSWORD
  // =========================================================

  function togglePassword(inputId, button) {

    const input =
      document.getElementById(inputId);

    if (!input) return;

    if (input.type === 'password') {

      input.type = 'text';

      button.textContent = '👁';

      button.setAttribute(
        'aria-label',
        'Sembunyikan password'
      );

    } else {

      input.type = 'password';

      button.textContent = '👁';

      button.setAttribute(
        'aria-label',
        'Tampilkan password'
      );
    }
  }


  // =========================================================
  // LOGIN ADMIN
  // =========================================================

  async function loginAdmin() {

    const email =
      document
        .getElementById('adminEmail')
        .value
        .trim();

    const password =
      document
        .getElementById('adminPassword')
        .value;

    const message =
      document.getElementById(
        'loginMessage'
      );

    const button =
      document.getElementById(
        'loginButton'
      );

    message.classList.add('hidden');

    if (!email || !password) {

      message.textContent =
        'Email dan password wajib diisi.';

      message.classList.remove('hidden');

      return;
    }


    // =====================================================
    // CEK EMAIL SEBELUM LOGIN
    //
    // User biasa bahkan tidak perlu diproses
    // sebagai admin.
    // =====================================================

    if (
      email.toLowerCase() !==
      ADMIN_EMAIL.trim().toLowerCase()
    ) {

      message.textContent =
        'Akses ditolak. Email ini bukan akun admin.';

      message.classList.remove('hidden');

      return;
    }


    button.disabled = true;
    button.textContent = 'Memeriksa...';


    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });


      if (error) {

        message.textContent =
          error.message;

        message.classList.remove('hidden');

        return;
      }


      if (!data.session || !data.user) {

        message.textContent =
          'Session admin tidak ditemukan.';

        message.classList.remove('hidden');

        await supabaseClient.auth.signOut();

        return;
      }


      // ===================================================
      // CEK LAGI EMAIL USER YANG BENAR-BENAR LOGIN
      // ===================================================

      if (!isAdminUser(data.user)) {

        await supabaseClient.auth.signOut();

        message.textContent =
          'Akses ditolak. Akun ini bukan admin.';

        message.classList.remove('hidden');

        return;
      }


      // ===================================================
      // ADMIN VALID
      // ===================================================

      document
        .getElementById('loggedAdminEmail')
        .textContent =
          data.user.email || '';


      document
        .getElementById('loginCard')
        .classList.add('hidden');


      document
        .getElementById('adminCard')
        .classList.remove('hidden');


    } catch (error) {

      console.error(error);

      message.textContent =
        error.message ||
        'Terjadi kesalahan saat login.';

      message.classList.remove('hidden');

    } finally {

      button.disabled = false;
      button.textContent = 'Masuk';

    }
  }


  // =========================================================
  // UPDATE USER
  // =========================================================

  async function updateUser() {

    const oldEmail =
      document
        .getElementById('oldEmail')
        .value
        .trim();

    const newEmail =
      document
        .getElementById('newEmail')
        .value
        .trim();

    const newPassword =
      document
        .getElementById('newPassword')
        .value;

    const message =
      document.getElementById(
        'updateMessage'
      );

    const button =
      document.getElementById(
        'updateButton'
      );


    message.className =
      'message hidden';


    if (!oldEmail) {

      showUpdateMessage(
        'Email lama wajib diisi.',
        'error'
      );

      return;
    }


    if (!newEmail && !newPassword) {

      showUpdateMessage(
        'Isi email baru atau password baru.',
        'error'
      );

      return;
    }


    if (
      newPassword &&
      newPassword.length < 6
    ) {

      showUpdateMessage(
        'Password minimal 6 karakter.',
        'error'
      );

      return;
    }


    button.disabled = true;
    button.textContent = 'Memproses...';


    try {

      // ===================================================
      // AMBIL SESSION ADMIN
      // ===================================================

      const {
        data: {
          session
        }
      } =
        await supabaseClient.auth.getSession();


      if (!session || !session.user) {

        throw new Error(
          'Session admin sudah berakhir. Silakan login lagi.'
        );
      }


      // ===================================================
      // CEK ADMIN SEKALI LAGI
      // ===================================================

      if (!isAdminUser(session.user)) {

        await supabaseClient.auth.signOut();

        throw new Error(
          'Akses ditolak. Akun ini bukan admin.'
        );
      }


      // ===================================================
      // PANGGIL EDGE FUNCTION
      // ===================================================

      const response =
        await fetch(
          SUPABASE_URL +
          '/functions/v1/admin-update-user',
          {
            method: 'POST',

            headers: {

              'Authorization':
                'Bearer ' +
                session.access_token,

              'apikey':
                SUPABASE_ANON_KEY,

              'Content-Type':
                'application/json'
            },

            body: JSON.stringify({

              oldEmail,
              newEmail,
              newPassword

            })
          }
        );


      const result =
        await response.json();


      if (
        !response.ok ||
        !result.success
      ) {

        throw new Error(
          result.message ||
          'Gagal memperbarui akun.'
        );
      }


      // ===================================================
      // BERHASIL
      // ===================================================

      showUpdateMessage(
        'Berhasil! Email/password user sudah diperbarui.',
        'success'
      );


      document
        .getElementById('oldEmail')
        .value = '';


      document
        .getElementById('newEmail')
        .value = '';


      document
        .getElementById('newPassword')
        .value = '';


    } catch (error) {

      console.error(error);

      showUpdateMessage(
        error.message ||
        'Terjadi kesalahan.',
        'error'
      );

    } finally {

      button.disabled = false;
      button.textContent =
        'Simpan Perubahan';
    }
  }


  // =========================================================
  // MESSAGE
  // =========================================================

  function showUpdateMessage(
    text,
    type
  ) {

    const message =
      document.getElementById(
        'updateMessage'
      );

    message.textContent = text;

    message.className =
      'message ' + type;
  }


  // =========================================================
  // LOGOUT
  // =========================================================

  async function logoutAdmin() {

    await supabaseClient.auth.signOut();

    document
      .getElementById('adminCard')
      .classList.add('hidden');

    document
      .getElementById('loginCard')
      .classList.remove('hidden');

    document
      .getElementById('adminEmail')
      .value = '';

    document
      .getElementById('adminPassword')
      .value = '';

    document
      .getElementById('oldEmail')
      .value = '';

    document
      .getElementById('newEmail')
      .value = '';

    document
      .getElementById('newPassword')
      .value = '';

    document
      .getElementById('loginMessage')
      .classList.add('hidden');

    document
      .getElementById('updateMessage')
      .classList.add('hidden');
  }


  // =========================================================
  // CEK SESSION SAAT PAGE DIBUKA
  // =========================================================

  async function checkSession() {

    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    if (!session || !session.user) {
      return;
    }


    // =====================================================
    // SESSION ADA, TAPI BUKAN ADMIN
    // =====================================================

    if (!isAdminUser(session.user)) {

      await supabaseClient.auth.signOut();

      return;
    }


    // =====================================================
    // SESSION VALID DAN USER ADALAH ADMIN
    // =====================================================

    document
      .getElementById('loggedAdminEmail')
      .textContent =
        session.user.email || '';


    document
      .getElementById('loginCard')
      .classList.add('hidden');


    document
      .getElementById('adminCard')
      .classList.remove('hidden');
  }


  // =========================================================
  // JALANKAN CEK SESSION
  // =========================================================

  checkSession();

</script>

</body>
</html>
